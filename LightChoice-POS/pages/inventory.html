<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventory</title>

<link rel="stylesheet" href="../assets/css/base/style.css">
<link rel="stylesheet" href="../assets/css/pages/inventory.css">



</head>

<body>
<div class="inventory-container">

    <h1>Inventory Management</h1>

    <!-- Summary Cards -->

    <div class="inventory-cards">

        <div class="card">
            <h3>Total Products</h3>
            <h2 id="total-products">0</h2>
        </div>

        <div class="card">
            <h3>Low Stock</h3>
            <h2 id="low-stock">0</h2>
        </div>

        <div class="card">
            <h3>Out of Stock</h3>
            <h2 id="out-stock">0</h2>
        </div>

    </div>

    <!-- Search -->

    <div class="inventory-toolbar">

        <input
    type="text"
    id="inventory-search"
    placeholder="Search products..."
    onkeyup="searchInventory()">

        <button onclick="openAddProduct()">
            + Add Product
        </button>

    </div>

    <!-- Inventory Table -->

    <table class="inventory-table">

        <thead>

            <tr>

                <th>Barcode</th>
                <th>Product</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Status</th>
                <th>Actions</th>

            </tr>

        </thead>

        <tbody id="inventory-body">

        </tbody>

    </table>

</div>

<!-- Product Modal -->

<div id="product-modal" class="modal" style="display:none;">

    <div class="modal-content">

        <h2 id="modal-title">Add Product</h2>

        <input type="hidden" id="product-id">

        <label>Barcode</label>
        <input type="text" id="barcode">

        

        <label>Product Name</label>
        <input type="text" id="product-name">

        <label>Category</label>
        <input type="text" id="category">

        <label>Price</label>
        <input type="number" id="price">

        <label>Stock</label>
        <input type="number" id="stock">

        <label>Unit</label>
        <input type="text" id="unit">

        <label>Sale Type</label>

        <select id="sale-type">
            <option value="piece">Piece</option>
            <option value="weight">Weight</option>
        </select>

       <label>Product Image</label> <input type="file" id="product-image" accept="image/*">

        <br><br>

        <button onclick="saveProduct()">
            Save
        </button>

        <button onclick="closeProductModal()">
            Cancel
        </button>

    </div>

</div>


<script src="../assets/js/auth/permissions.js"></script>

<script>

protectPage("inventory");

</script>
<script src="../assets/data/products.js"></script>
<script src="../assets/js/productStorage.js"></script>
<script src="../assets/js/inventory.js"></script>
<script src="../assets/js/storage.js"></script>


</body>

</html>
